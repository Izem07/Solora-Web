name: Validate & Notify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check main.js && echo "✓ main.js syntax OK"

      - name: Confirm deploy source
        run: |
          echo "✓ Push to main detected."
          echo "CasaOS will build from: https://github.com/Izem07/Solora-Web.git#main"
          echo "To update your running container, run on CasaOS:"
          echo "  docker compose down && docker compose up -d --build"
