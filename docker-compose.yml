name: solora

services:
  solora:
    image: izem07/solora:latest
    container_name: solora
    restart: unless-stopped
    ports:
      - "3080:3000"
    environment:
      PORT: 3000
      NAVIDROME_DIR: /music
      NAVIDROME_URL: "http://100.68.222.8:4533"
    volumes:
      - /DATA/Media/Music:/music
