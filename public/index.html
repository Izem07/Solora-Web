<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solora | Music Inspector & Downloader</title>
  <link rel="icon" type="image/jpeg" href="solora-icon.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="logo">
        <img src="solora-icon.jpg" alt="Solora Logo" class="logo-img">
        <h1>SOLORA</h1>
      </div>
      <p class="subtitle">Inspect &bull; Download &bull; Navidrome Sync</p>
    </header>

    <main>

      <!-- ── Settings Panel (collapsed by default) ── -->
      <div class="settings-panel" id="settingsPanel">
        <button class="settings-toggle" id="settingsToggle" type="button">
          <span class="settings-icon">⚙</span>
          <span class="settings-label">Settings</span>
          <span class="settings-chevron">▾</span>
        </button>

        <div class="settings-body hidden" id="settingsBody">
          <!-- Row 1: backend + navidrome URL -->
          <div class="settings-row">
            <input type="text" id="serverUrl"
              placeholder="Solora Backend (leave blank if local)" />
            <input type="text" id="navidromeUrlInput"
              placeholder="Navidrome URL (e.g. http://192.168.1.10:4533) — NOT a file path" />
          </div>
          <!-- Row 2: music dir -->
          <div class="settings-row">
            <input type="text" id="navidromeDirInput"
              placeholder="Music Directory (e.g. \\server\Music or /music)" />
          </div>
          <!-- Row 3: credentials + test -->
          <div class="settings-row settings-auth-row">
            <input type="text" id="navidromeUserInput"
              placeholder="Navidrome Username" autocomplete="off" />
            <input type="password" id="navidromePassInput"
              placeholder="Password" autocomplete="off" />
            <button type="button" id="testNavidromeBtn" class="btn-test-nav">Test</button>
          </div>
          <div id="navidromeStatus" class="navidrome-status hidden"></div>
        </div>
      </div>

      <!-- ── Search ── -->
      <section class="search-box">
        <input type="text" id="urlInput"
          placeholder="Paste Spotify track, album, or playlist URL…"
          autocomplete="off" />
        <button id="inspectBtn">Inspect</button>
      </section>

      <!-- ── Add individual track (shown after inspect) ── -->
      <div id="addTrackRow" class="add-track-row hidden">
        <input type="text" id="addTrackInput"
          placeholder="Add a Spotify track URL…"
          autocomplete="off" />
        <button id="addTrackBtn" class="btn-add-track">+ Add</button>
      </div>

      <!-- ── Collection header ── -->
      <section id="collectionHeader" class="collection-header hidden"></section>

      <!-- ── Selection toolbar ── -->
      <section id="selectionToolbar" class="selection-toolbar hidden">
        <div class="select-all-box">
          <input type="checkbox" id="selectAllCheckbox" class="custom-checkbox">
          <label for="selectAllCheckbox">Select All</label>
        </div>
        <span id="selectedCountBadge" class="selected-count">0 selected</span>
      </section>

      <!-- ── Progress bar ── -->
      <section id="progressSection" class="progress-section hidden">
        <div class="progress-info">
          <span id="progressStatusText">Processing…</span>
          <button id="cancelBtn" class="btn-cancel" type="button">Cancel</button>
        </div>
        <div class="progress-bar-track">
          <div id="progressBarFill" class="progress-bar-fill"></div>
        </div>
      </section>

      <!-- ── Track list ── -->
      <section class="track-stage">
        <div id="trackList" class="track-grid">
          <div class="placeholder">Paste a Spotify link and click Inspect.</div>
        </div>
      </section>

      <!-- ── Activity log ── -->
      <section class="terminal-drawer">
        <button id="toggleTerminalBtn" class="terminal-toggle" type="button">
          <span class="toggle-icon">▸</span> Activity Log
        </button>
        <div id="terminalBody" class="terminal-body hidden">
          <pre id="terminalLogs">Ready.</pre>
        </div>
      </section>
    </main>

    <!-- ── Floating batch action bar ── -->
    <div id="floatingActionBar" class="floating-action-bar hidden">
      <div class="floating-content">
        <div class="floating-status">
          <span class="status-dot"></span>
          <span id="floatingSelectedText">0 tracks selected</span>
        </div>
        <div class="floating-buttons">
          <button id="downloadSelectedZipBtn" class="btn-yellow">
            ⚡ ZIP Download
          </button>
          <button id="sendToNavidromeBtn" class="btn-navidrome">
            🚀 Send to Navidrome
          </button>
        </div>
      </div>
    </div>

    <div id="toastNotification" class="toast hidden">
      <span id="toastMessage" class="toast-message"></span>
      <button id="toastClose" class="toast-close" type="button" aria-label="Dismiss">&times;</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
